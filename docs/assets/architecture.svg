<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="AutoBI architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="24" fill="url(#bg)"/>
  <text x="48" y="48" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">AutoBI runtime</text>
  <text x="48" y="74" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Modular monolith · pnpm workspace</text>

  <!-- Web -->
  <g filter="url(#shadow)">
    <rect x="48" y="110" width="180" height="90" rx="16" fill="#134e4a"/>
    <text x="138" y="152" text-anchor="middle" fill="#ccfbf1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Web</text>
    <text x="138" y="176" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Next.js · dashboards</text>
  </g>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="280" y="110" width="180" height="90" rx="16" fill="#1e3a5f"/>
    <text x="370" y="152" text-anchor="middle" fill="#dbeafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">API</text>
    <text x="370" y="176" text-anchor="middle" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">NestJS · /api/v1</text>
  </g>

  <!-- Worker -->
  <g filter="url(#shadow)">
    <rect x="512" y="110" width="180" height="90" rx="16" fill="#3b2f1e"/>
    <text x="602" y="152" text-anchor="middle" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Worker</text>
    <text x="602" y="176" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">BullMQ · introspect</text>
  </g>

  <!-- Packages -->
  <g filter="url(#shadow)">
    <rect x="744" y="110" width="168" height="90" rx="16" fill="#312e81"/>
    <text x="828" y="152" text-anchor="middle" fill="#e0e7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Packages</text>
    <text x="828" y="176" text-anchor="middle" fill="#c7d2fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">engines · connectors</text>
  </g>

  <!-- arrows -->
  <path d="M228 155 H280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460 155 H512" stroke="#64748b" stroke-width="2"/>
  <path d="M692 155 H744" stroke="#64748b" stroke-width="2"/>

  <!-- infra -->
  <g filter="url(#shadow)">
    <rect x="190" y="260" width="200" height="90" rx="16" fill="#14532d"/>
    <text x="290" y="302" text-anchor="middle" fill="#dcfce7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">PostgreSQL</text>
    <text x="290" y="326" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Prisma · app state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="260" width="200" height="90" rx="16" fill="#7f1d1d"/>
    <text x="530" y="302" text-anchor="middle" fill="#fee2e2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Redis</text>
    <text x="530" y="326" text-anchor="middle" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">sessions · queues</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="670" y="260" width="242" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="791" y="302" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Customer DBs</text>
    <text x="791" y="326" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Postgres · MySQL · SQL Server · SQLite</text>
  </g>

  <path d="M370 200 V260" stroke="#64748b" stroke-width="2"/>
  <path d="M602 200 V260" stroke="#64748b" stroke-width="2"/>
  <path d="M828 200 V260" stroke="#64748b" stroke-width="2"/>
</svg>
